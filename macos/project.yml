# XcodeGen spec for GlassCell.app with its extensions (App Intents metadata and app extensions
# need Xcode's build system). macos/build-xcode.sh generates GlassCell.xcodeproj (not committed)
# and builds it. The SwiftPM package (macos/GridCraft, named for the engine) stays the place for
# code and tests.
name: GlassCell
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  GridCraft:
    path: GridCraft
settings:
  base:
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  GlassCell:
    type: application
    platform: macOS
    sources:
      - path: GridCraft/Sources/GridCraft
      - path: GridCraft/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: GridCraft/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: GridCraft
        product: GridCraftUI
      - target: GridCraftQuickLook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kano-zheng.glasscell
        PRODUCT_NAME: GlassCell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GridCraft/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  GridCraftQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: GridCraft/Sources/QuickLook
    dependencies:
      - package: GridCraft
        product: GridCraftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kano-zheng.glasscell.quicklook
        PRODUCT_NAME: GridCraftQuickLook
        INFOPLIST_FILE: GridCraft/Resources/QuickLook/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GridCraft/Resources/QuickLook/QuickLook.entitlements
schemes:
  # Not "GridCraft": the package's executable product has that name, and xcodebuild picked
  # either scheme of a shared name (then built no app).
  GlassCell:
    build:
      targets:
        GlassCell: all
