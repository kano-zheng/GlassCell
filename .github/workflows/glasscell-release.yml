# A GlassCell release: push a tag like v0.1.0. It builds GlassCell.app for Apple silicon and Intel,
# packs it as a .dmg and a .zip, and publishes them in a GitHub Release named after the tag.
# The app is signed ad hoc (no Developer ID yet): the first launch needs Open Anyway in
# System Settings › Privacy & Security.
name: GlassCell release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (it must exist), e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Version from the tag
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::tags look like v0.1.0, not $TAG"; exit 1 ;; esac
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Xcode (the newest on the runner)
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Tools
        run: |
          brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Engine (Apple silicon and Intel)
        run: macos/build-engine.sh
      - name: Tests
        run: cd macos/GridCraft && swift test
      - name: GlassCell.app
        run: MARKETING_VERSION="$VERSION" BUILD_NUMBER="${{ github.run_number }}" SKIP_ENGINE=1 macos/build-xcode.sh
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/mac/GlassCell.app "dist/GlassCell-$VERSION.zip"
          staging=$(mktemp -d)
          cp -R target/mac/GlassCell.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "GlassCell $VERSION" -srcfolder "$staging" -ov -format UDZO "dist/GlassCell-$VERSION.dmg"
          (cd dist && shasum -a 256 GlassCell-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="GlassCell $VERSION for macOS 26 (Apple silicon and Intel).

          It is signed ad hoc, not notarized: after the first launch, open System Settings › Privacy & Security and choose Open Anyway."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "GlassCell $VERSION" --notes "$notes" --generate-notes
          fi
